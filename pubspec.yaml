name: clipboard_ai_manager
description: Clippy is a Flutter clipboard history manager with optional backend-powered AI actions.
version: 0.1.0+1
environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  get: ^4.6.6
  http: ^1.2.2
  path: ^1.9.0
  intl: ^0.19.0
  sqflite: ^2.3.3+1
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

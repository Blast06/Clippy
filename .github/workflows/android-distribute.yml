name: Android → Firebase App Distribution

# Every push to develop builds a signed release APK and sends it to the
# "testers" group in Firebase App Distribution. Can also be run by hand
# from the Actions tab.
on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: android-distribute
  cancel-in-progress: true

jobs:
  build-and-distribute:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter test

      # A stable keystore is required: if every build were signed with a
      # throw-away debug key, Android would refuse to install it over the
      # previous build.
      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF

      # run_number gives every build a higher versionCode so it installs as
      # an update on the device.
      - name: Build APK
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=CLIPPY_BACKEND_BASE_URL=${{ vars.CLIPPY_BACKEND_BASE_URL }}

      - name: Release notes
        run: git log -1 --pretty=format:'%h %s' > release-notes.txt

      - uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          groups: testers
          releaseNotesFile: release-notes.txt
          file: build/app/outputs/flutter-apk/app-release.apk
